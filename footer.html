<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brown's Boutique - Footer</title>
  
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Fuentes de Google para el logo y texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="CSS/footer.css">
</head>
<body>

  <footer class="site-footer">
    <div class="footer-container">
      
      <!-- Columna 1: Logo & Redes Sociales -->
      <div class="footer-col footer-brand">
        <div class="logo">
          <span class="logo-script">Brown's</span>
          <span class="logo-sub">BOUTIQUE</span>
        </div>
        <div class="social-icons">
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
      </div>

      <!-- Columna 2: Contacto -->
      <div class="footer-col">
        <h3 class="footer-title">Contacto</h3>
        <ul class="contact-info">
          <li><i class="fa-solid fa-phone"></i> <span>797 122 7699</span></li>
          <li><i class="fa-regular fa-envelope"></i> <span>carlosortegadeita@gmail.com</span></li>
          <li><i class="fa-solid fa-location-dot"></i> <span>Zacatlán, Puebla</span></li>
        </ul>
      </div>

      <!-- Columna 3: Métodos de Pago -->
      <div class="footer-col">
        <h3 class="footer-title">Métodos de Pago</h3>
        <div class="payment-methods">
          <span class="pay-card visa">VISA</span>
          <span class="pay-card mc">
            <span class="circle red"></span>
            <span class="circle orange"></span>
          </span>
          <span class="pay-card pay-badge">Pay</span>
          <span class="cash">Efectivo al recoger</span>

        </div>
      </div>

    </div>

    <!-- Divisor y Copyright -->
    <div class="footer-bottom">
      <hr class="footer-divider">
      <p class="copyright">Copyright © 2026 Brown's BOUTIQUE</p>
    </div>
  </footer>

</body>
</html>
